  <path fill="#ffffff" d="
      M32,28 L46,26 L60,50 L74,26 L88,28
      L68,60 L88,92 L74,94 L60,70 L46,94 L32,92 L52,60 Z"/>

  <g fill="#ffffff">
    <path d="M132,18 L150,18 L163,44 L176,18 L194,18
             L172,60 L194,102 L176,102 L163,76 L150,102 L132,102
             L154,60 Z"/>
    <path d="M396,18 L414,18 L427,44 L440,18 L458,18
             L436,60 L458,102 L440,102 L427,76 L414,102 L396,102
             L418,60 Z"/>
    <path d="M208,18 L254,18
             C272,18 283,28 283,43
             C283,52 278,59 270,63
             C281,66 289,74 289,86
             C289,97 279,102 258,102
             L208,102 Z
             M227,34 L227,54 L250,54
             C258,54 264,50 264,44 C264,38 258,34 250,34 Z
             M227,68 L227,86 L254,86
             C263,86 269,83 269,77 C269,71 263,68 254,68 Z"
          fill="#ffffff" fill-rule="evenodd"/>
