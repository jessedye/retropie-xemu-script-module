<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg"
     width="460px" height="300px" viewBox="0 0 460 300">
  <title>Xbox Controller S</title>
  <!-- Stroked body with filled controls. No text, no evenodd, no arc commands:
       EmulationStation renders this through nanosvg. The waist sits low enough
       that no control overlaps the outline. -->
  <path fill="none" stroke="#ffffff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"
        d="M230,52
           C270,52 302,58 324,68
           C360,62 396,84 412,122
           C434,174 424,240 390,264
           C364,282 336,270 322,242
           C308,214 294,204 274,200
           C260,197 244,196 230,196
           C216,196 200,197 186,200
           C166,204 152,214 138,242
           C124,270 96,282 70,264
           C36,240 26,174 48,122
           C64,84 100,62 136,68
           C158,58 190,52 230,52 Z"/>

  <!-- Left analog stick -->
  <circle cx="126" cy="112" r="29" fill="none" stroke="#ffffff" stroke-width="11"/>
  <circle cx="126" cy="112" r="12" fill="#ffffff"/>

  <!-- D-pad, below and inboard of the left stick -->
  <path fill="#ffffff" d="M156,162 h19 v-19 h19 v19 h19 v19 h-19 v19 h-19 v-19 h-19 Z"/>

  <!-- Face buttons: Y X B A -->
  <circle cx="348" cy="88"  r="17" fill="#ffffff"/>
  <circle cx="386" cy="126" r="17" fill="#ffffff"/>
  <circle cx="348" cy="164" r="17" fill="#ffffff"/>
  <circle cx="310" cy="126" r="17" fill="#ffffff"/>

  <!-- Black and white buttons, tucked above the diamond -->
  <circle cx="392" cy="78" r="9" fill="#ffffff"/>
  <circle cx="372" cy="60" r="9" fill="#ffffff"/>

  <!-- Right analog stick, inboard so it clears the waist -->
  <circle cx="272" cy="166" r="27" fill="none" stroke="#ffffff" stroke-width="11"/>
  <circle cx="272" cy="166" r="11" fill="#ffffff"/>

  <!-- Back and Start, either side of the jewel -->
  <circle cx="200" cy="106" r="10" fill="#ffffff"/>
  <circle cx="260" cy="106" r="10" fill="#ffffff"/>

  <!-- Centre jewel -->
  <circle cx="230" cy="80" r="22" fill="#107C10"/>
  <path fill="#ffffff" d="
      M216,66 L224,80 L216,94 L221,96 L230,84 L239,96 L244,94
      L236,80 L244,66 L239,64 L230,76 L221,64 Z"/>
</svg>
